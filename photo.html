<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prendre une Photo avec la Caméra Arrière</title>
</head>
<body>
    <h1>Prendre une Photo avec la Caméra Arrière</h1>

    <!-- Afficher la vue de la caméra -->
    <video id="camera-view" autoplay></video>

    <!-- Bouton pour prendre une photo avec la caméra arrière -->
    <button id="capture-button">Prendre une Photo</button>

    <!-- Afficher la photo capturée -->
    <h2>Photo Capturée</h2>
    <img src="" alt="Photo Capturée" id="captured-photo">

    <script>
        const cameraView = document.getElementById('camera-view');
        const captureButton = document.getElementById('capture-button');
        const capturedPhoto = document.getElementById('captured-photo');
        let mediaStream = null;

        // Gestionnaire d'événements pour le bouton de capture
        captureButton.addEventListener('click', async function() {
            try {
                // Accéder à la caméra arrière
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                cameraView.srcObject = mediaStream;

                // Attendre que la caméra soit prête
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Capturer une image depuis la caméra arrière
                const canvas = document.createElement('canvas');
                canvas.width = cameraView.videoWidth;
                canvas.height = cameraView.videoHeight;
                canvas.getContext('2d').drawImage(cameraView, 0, 0, canvas.width, canvas.height);
                const photoDataUrl = canvas.toDataURL('image/jpeg');

                // Afficher la photo capturée
                capturedPhoto.src = photoDataUrl;

                // Vous pouvez envoyer la photo vers le serveur ici
            } catch (error) {
                console.error('Erreur lors de la capture de la photo :', error);
            } finally {
                // Arrêter la caméra après la capture
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
            }
        });
    </script>
</body>
</html>
